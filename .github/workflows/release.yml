name: Release

# Builds the Windows release on every push to main:
#   1. build job  (windows-latest): Go checks + installer.exe (the
#      launcher),
#      Flutter checks + xbox-checker.exe (the window), assembles the full
#      release bundle.
#   2. publish job (ubuntu-latest): writes dist-test/manifest.json exactly
#      like tools/manifest.py does locally, commits dist-test back to main
#      ([skip ci] prevents loops), then pushes exe + manifest to R2 via
#      tools/r2push.py (same gates: version == AppVersion, manifest sha ==
#      exe sha, exe uploaded before manifest, read-back verification).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go checks
        shell: bash
        run: |
          export CGO_ENABLED=0
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needed on:" >&2
            echo "$fmt_out" >&2
            exit 1
          fi
          go vet ./...
          go test ./...

      - name: Build backend exe
        shell: bash
        run: |
          export CGO_ENABLED=0
          go build -trimpath -ldflags "-s -w" -o dist-test/installer.exe .

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Flutter checks
        shell: bash
        working-directory: client
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Flutter Windows client
        shell: bash
        working-directory: client
        run: flutter build windows --release

      - name: Assemble release bundle
        shell: bash
        run: |
          mkdir -p bundle
          cp -a client/build/windows/x64/runner/Release/. bundle/
          cp dist-test/installer.exe bundle/
          test -f bundle/xbox-checker.exe
          test -f bundle/installer.exe
          # The launcher refuses to start without the Flutter asset bundle —
          # fail the build here instead of shipping a client that cannot run.
          test -d bundle/data/flutter_assets
          ls -la bundle

      - name: Build Go engine shared library (dart:ffi)
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw -y --no-progress
            export PATH="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          fi
          gcc --version
          # Link the engine DLL statically: a dynamic dependency on MinGW
          # runtimes (libgcc/libwinpthread) that end users do not have makes
          # the Flutter app fail to load the engine on clean machines.
          if ! CGO_ENABLED=1 go build -buildmode=c-shared -ldflags="-extldflags '-static'" -o solo.dll .; then
            echo "static link failed — dynamic fallback, bundled runtimes below"
            CGO_ENABLED=1 go build -buildmode=c-shared -o solo.dll .
          fi
          imports="$(objdump -p solo.dll | awk '/DLL Name/{print $3}')"
          echo "DLL imports:"
          echo "$imports"
          # Belt and braces: if the DLL still imports a MinGW runtime,
          # ship it inside the bundle so LoadLibrary can resolve it.
          libdir="$(dirname "$(gcc -print-libgcc-file-name)")"
          for f in libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll; do
            if echo "$imports" | grep -qix "$f"; then
              cp "$libdir/$f" bundle/
              echo "bundled $f"
            fi
          done
          mv solo.dll dist-test/
          rm -f solo.h
          cp dist-test/solo.dll bundle/
          test -f bundle/solo.dll
          ls -la dist-test/solo.dll bundle/solo.dll

      - name: Pack client bundle zip for R2
        shell: bash
        run: |
          ( cd bundle && 7z a -tzip ../dist-test/solo-checker-bundle.zip . )
          ls -la dist-test/solo-checker-bundle.zip
          python3 -c "import zipfile; print(len(zipfile.ZipFile('dist-test/solo-checker-bundle.zip').infolist()), 'entries')" 2>/dev/null || true

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: solo-checker-windows
          path: bundle/
          if-no-files-found: error

      - name: Upload dist-test binaries for publishing
        uses: actions/upload-artifact@v4
        with:
          name: dist-update
          path: |
            dist-test/installer.exe
            dist-test/solo.dll
            dist-test/solo-checker-bundle.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist-test binaries
        uses: actions/download-artifact@v4
        with:
          name: dist-update
          path: dist-test

      - name: Write update manifest
        run: python3 tools/manifest.py

      - name: Commit refreshed build to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist-test/installer.exe dist-test/solo.dll dist-test/manifest.json
          # drop pre-rename files so dist-test matches the manifest
          git rm --cached -q --ignore-unmatch dist-test/xbox_checker.dll dist-test/xbox-checker.exe dist-test/helper.exe
          if git diff --cached --quiet; then
            echo "dist-test is already up to date"
          else
            version="$(python3 -c 'import json;print(json.load(open("dist-test/manifest.json"))["version"])')"
            git commit -m "Release ${version}: rebuilt Windows exe + manifest [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Push build + manifest to R2
        run: python3 tools/r2push.py
